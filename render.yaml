services:
  - type: web
    name: agroconnect-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA_PATH
        sync: false
      - key: DB_SSL_VERIFY
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_POOL_ACQUIRE_MS
        value: "15000"
      - key: DB_POOL_IDLE_MS
        value: "10000"
      - key: DB_POOL_EVICT_MS
        value: "30000"
      - key: DB_POOL_KEEP_ALIVE
        value: "true"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: FRONTEND_URL
        sync: false
      - key: STORAGE_DRIVER
        value: "cloudinary"
      - key: PUBLIC_IMAGE_STORAGE_DRIVER
        value: "cloudinary"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_PUBLIC_FOLDER
        value: "agroconnect"
      - key: CLOUDINARY_UPLOAD_TIMEOUT_MS
        value: "15000"
      - key: CLOUDINARY_DELETE_TIMEOUT_MS
        value: "15000"
      - key: REQUEST_TIMEOUT_MS
        value: "45000"
      - key: CLOUDINARY_FOLDER
        value: "agroconnect/messages"

  - type: web
    name: agroconnect-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
